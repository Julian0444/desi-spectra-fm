name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[api,dev]"
      # Fast synthetic/unit checks: no frozen experiment data or real weights.
      # Extended local experiment/demo checks are recorded separately in docs.
      - name: Quick tests
        run: >-
          pytest -q
          tests/test_data.py tests/test_model.py tests/test_train.py
          tests/test_predict.py tests/test_evaluate.py tests/test_input_contract.py
          tests/test_inference_contract.py tests/test_gap_regressions.py
          tests/test_api.py tests/test_assets.py tests/test_experiment_metrics.py
